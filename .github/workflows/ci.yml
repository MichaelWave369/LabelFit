name: LabelFit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify repository foundation
        run: python3 scripts/verify_repo.py

      - name: Test deterministic core
        run: node tests/core.test.js

      - name: Test runtime ingredient matcher
        run: node tests/matcher.test.js

      - name: Test evidence and provenance
        run: node tests/evidence.test.js

      - name: Test household and Better Fit
        run: node tests/household.test.js

      - name: Test modular rule engine
        run: node tests/rules.test.js

      - name: Test input provider boundary
        run: node tests/providers.test.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            node --check "$file"
          done
